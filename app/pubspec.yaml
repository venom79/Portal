name: portal
description: "Self-hosted CCTV and remote monitoring system built with Flutter and WebRTC."

publish_to: "none"

version: 0.2.0+2

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  socket_io_client: ^3.1.6
  flutter_webrtc: ^1.5.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icon.png

flutter_launcher_icons:
  android: true
  ios: false

  image_path: "assets/icon.png"

  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon.png"

  min_sdk_android: 21
